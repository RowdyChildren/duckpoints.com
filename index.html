<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DuckBot is a simple points-tracking bot for Discord communities.">
  <title>DuckBot</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f6f8fa;
      --surface: #ffffff;
      --text: #16202c;
      --muted: #58636f;
      --accent: #0e6e66;
      --accent-dark: #0b564f;
      --accent-soft: #e8f2f0;
      --border: #e2e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--background);
      color: var(--text);
    }

    main {
      width: min(680px, calc(100% - 32px));
      padding: 56px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(22, 32, 44, 0.08);
    }

    .mark {
      display: inline-grid;
      width: 58px;
      height: 58px;
      place-items: center;
      border-radius: 16px;
      background: var(--accent-soft);
      color: var(--accent-dark);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 24px;
      font-weight: 800;
    }

    h1 {
      margin: 24px 0 12px;
      font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      font-size: clamp(42px, 9vw, 66px);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 19px;
      line-height: 1.6;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }

    a {
      display: inline-block;
      padding: 11px 16px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--accent-dark);
      font-weight: 650;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    footer {
      margin-top: 40px;
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 540px) {
      main {
        padding: 36px 28px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">++</div>
    <h1>DuckBot</h1>
    <p>A simple points-tracking bot for Discord communities.</p>
    <nav aria-label="Legal">
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="terms-of-service.html">Terms of Service</a>
    </nav>
    <footer>Operated by Duck Bot LLC</footer>
  </main>
</body>
</html>
