<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DuckBot is a simple points-tracking bot for Discord communities.">
  <title>DuckBot</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f6f8fa;
      --surface: #ffffff;
      --text: #16202c;
      --muted: #58636f;
      --accent: #0e6e66;
      --accent-dark: #0b564f;
      --accent-soft: #e8f2f0;
      --border: #e2e7eb;
      --shadow: rgba(22, 32, 44, 0.08);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      background: var(--background);
      color: var(--text);
    }

    .home-shell {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 32px 0;
    }

    main {
      width: min(680px, calc(100% - 32px));
      padding: 56px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 18px 50px var(--shadow);
    }

    .mark {
      display: inline-grid;
      width: 58px;
      height: 58px;
      place-items: center;
      border-radius: 16px;
      background: var(--accent-soft);
      color: var(--accent-dark);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 24px;
      font-weight: 800;
    }

    h1 {
      margin: 24px 0 12px;
      font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      font-size: clamp(42px, 9vw, 66px);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 19px;
      line-height: 1.6;
    }

    .link-list {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }

    a {
      display: inline-block;
      padding: 11px 16px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--accent-dark);
      font-weight: 650;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    footer {
      margin-top: 40px;
      color: var(--muted);
      font-size: 14px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --background: #0d1518;
        --surface: #152126;
        --text: #eef5f3;
        --muted: #a8b7b4;
        --accent: #61c8bc;
        --accent-dark: #83ddd2;
        --accent-soft: #183b39;
        --border: #2a3c42;
        --shadow: rgba(0, 0, 0, 0.35);
      }
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --background: #0d1518;
      --surface: #152126;
      --text: #eef5f3;
      --muted: #a8b7b4;
      --accent: #61c8bc;
      --accent-dark: #83ddd2;
      --accent-soft: #183b39;
      --border: #2a3c42;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    :root[data-theme="light"] {
      color-scheme: light;
    }

    @media (max-width: 540px) {
      main {
        padding: 36px 28px;
      }
    }
  </style>
  <link rel="stylesheet" href="site.css">
  <script src="theme.js"></script>
</head>
<body>
  <nav class="site-nav" aria-label="Primary">
    <div class="site-nav__inner">
      <a class="site-nav__brand" href="index.html" aria-current="page"><span class="site-nav__mark" aria-hidden="true">++</span>DuckBot</a>
      <div class="site-nav__links">
        <a href="index.html" aria-current="page">Home</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="privacy-policy.html">Privacy</a>
        <a href="terms-of-service.html">Terms</a>
      </div>
    </div>
  </nav>
  <div class="home-shell">
    <main>
      <div class="mark" aria-hidden="true">++</div>
      <h1>DuckBot</h1>
      <p>A simple points-tracking bot for Discord communities.</p>
      <nav class="link-list" aria-label="Explore DuckBot">
        <a href="leaderboard.html">View Leaderboard</a>
        <a href="privacy-policy.html">Privacy Policy</a>
        <a href="terms-of-service.html">Terms of Service</a>
      </nav>
      <footer>Operated by Duck Bot LLC</footer>
    </main>
  </div>
</body>
</html>
