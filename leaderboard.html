<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="See the current DuckBot points leaderboard.">
  <title>Leaderboard — DuckBot</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f6f8fa;
      --surface: #ffffff;
      --text: #16202c;
      --muted: #58636f;
      --accent: #0e6e66;
      --accent-dark: #0b564f;
      --accent-soft: #e8f2f0;
      --border: #e2e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--background);
      color: var(--text);
    }

    main {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding: 64px 0 80px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      font-size: clamp(42px, 8vw, 64px);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .intro {
      max-width: 650px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.6;
    }

    .intro code {
      padding: 2px 6px;
      border-radius: 5px;
      background: var(--accent-soft);
      color: var(--accent-dark);
      font-size: 0.85em;
    }

    .leaderboard-card {
      margin-top: 38px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 18px 50px rgba(22, 32, 44, 0.07);
    }

    .leaderboard-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
    }

    label {
      flex: 1;
      max-width: 360px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font: inherit;
    }

    input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-color: var(--accent);
    }

    input:disabled {
      background: var(--background);
    }

    #result-count {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      white-space: nowrap;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 15px 20px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    th {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover {
      background: #fafcfc;
    }

    .rank {
      width: 80px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .item-name {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      overflow-wrap: anywhere;
      font-weight: 650;
      vertical-align: middle;
    }

    .discord-emoji {
      display: block;
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .item-type {
      display: inline-block;
      margin-left: 9px;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-dark);
      font-size: 11px;
      font-weight: 700;
      vertical-align: 2px;
    }

    .points {
      width: 130px;
      color: var(--accent-dark);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 750;
      text-align: right;
    }

    th:last-child {
      text-align: right;
    }

    #leaderboard-status {
      margin: 0;
      padding: 36px 20px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 600px) {
      main {
        padding-top: 44px;
      }

      .leaderboard-tools {
        align-items: stretch;
        flex-direction: column;
      }

      label {
        max-width: none;
      }

      th,
      td {
        padding: 13px 14px;
      }

      .rank {
        width: 55px;
      }

      .points {
        width: 90px;
      }
    }
  </style>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <nav class="site-nav" aria-label="Primary">
    <div class="site-nav__inner">
      <a class="site-nav__brand" href="index.html"><span class="site-nav__mark" aria-hidden="true">++</span>DuckBot</a>
      <div class="site-nav__links">
        <a href="index.html">Home</a>
        <a href="leaderboard.html" aria-current="page">Leaderboard</a>
        <a href="privacy-policy.html">Privacy</a>
        <a href="terms-of-service.html">Terms</a>
      </div>
    </div>
  </nav>

  <main>
    <p class="eyebrow">Duck Points</p>
    <h1>Leaderboard</h1>
    <p class="intro">The latest things earning points in <strong id="guild-name">Discord guild</strong> <code id="guild-id">618712310185197588</code>, ranked from highest to lowest.</p>

    <section class="leaderboard-card" aria-labelledby="leaderboard-heading">
      <h2 id="leaderboard-heading" hidden>Leaderboard entries</h2>
      <div class="leaderboard-tools">
        <label>
          <span hidden>Search leaderboard</span>
          <input id="leaderboard-search" type="search" placeholder="Search the leaderboard" autocomplete="off" disabled>
        </label>
        <span id="result-count" aria-live="polite">Loading...</span>
      </div>
      <p id="leaderboard-status" role="status">Loading leaderboard...</p>
      <div class="table-wrap">
        <table id="leaderboard-table" hidden>
          <thead>
            <tr>
              <th scope="col">Rank</th>
              <th scope="col">Name</th>
              <th scope="col">Points</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="leaderboard.js"></script>
</body>
</html>
